<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Explorer</title>
    <!-- Since the css is already in head, I thought it would be better if the JS was with it -->
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>
<body>
    <!-- ToDO -->
     <div class="topBar">
        <h1>Movie Explorer</h1>
     </div>
     <div class="search">
        <input type="text" id="searchMovie" placeholder="Search for a movie...">
        <select id="selectFilter">
            <option value="Sort By">Sort By</option>
            <option value="Release Date (Asc)">Release Date (Asc)</option>
            <option value="Release Date (Desc)">Release Date (Desc)</option>
            <option value="Rating (Asc)">Raiting (Asc)</option>
            <option value="Rating (Desc)">Raiting (Desc)</option>
        </select>
     </div>
     <div class="movies"></div>
     <div class="bottom">
        <button id="prev">Previous</button>
        <p>Page i of n</p>
        <button id="next">Next</button>
     </div>
</body>
</html>
